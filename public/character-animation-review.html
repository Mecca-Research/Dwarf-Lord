<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dwarf Lord · Character motion library</title><style>
:root{color-scheme:dark;font:16px system-ui;background:#171d20;color:#e8dfcf}*{box-sizing:border-box}body{margin:0;padding:24px;max-width:1500px;margin-inline:auto}h1{font:32px Georgia;margin:0 0 8px}p{color:#b8b6af;line-height:1.5}header{display:flex;justify-content:space-between;gap:24px;align-items:center}header label{display:flex;align-items:center;gap:8px}select,button,input{font:inherit}select,button{background:#2b3538;color:#eee4d4;border:1px solid #65716b;border-radius:6px;padding:10px;cursor:pointer}button:hover,button[aria-pressed=true]{border-color:#d4a76c;background:#514332}button:focus-visible,select:focus-visible{outline:3px solid #d4a76c}main{display:grid;grid-template-columns:1fr 1fr;gap:18px}.stage{position:relative;height:560px;background-color:#343d3c;background-image:linear-gradient(45deg,#3b4443 25%,transparent 25%),linear-gradient(-45deg,#3b4443 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#3b4443 75%),linear-gradient(-45deg,transparent 75%,#3b4443 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;border:1px solid #52615c;border-radius:8px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}.stage img{max-height:95%;max-width:96%;object-fit:contain}figure{margin:0}figcaption{margin:10px 0;color:#c9bb9f}#active{height:100%;max-height:100%}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0}#frames{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin:20px 0}#frames button{padding:5px;font-size:13px}#frames img{display:block;height:155px;width:100%;object-fit:contain}.hint{font-size:14px}.links a{color:#deb582;margin-right:18px}#identity{min-height:48px}#error{color:#ffa997}@media(max-width:700px){body{padding:14px}header{display:block}main{gap:10px}.stage{height:350px}#frames{grid-template-columns:repeat(3,1fr)}h1{font-size:26px}}
</style></head><body><header><div><h1>Character motion library</h1><p>Canonical likeness, viewing angles, and detailed work references.</p></div><label>Library <select id="library" aria-label="Library"><option value="work">Work references</option><option value="poses">Angles and stances</option></select></label><label>Character <select id="character" aria-label="Character"></select></label></header><p id="identity"></p><main><figure><div class="stage"><img id="canonical" alt="Canonical character"></div><figcaption>Canonical character</figcaption></figure><figure><div class="stage"><img id="active" alt="Selected pose"></div><figcaption id="pose">Loading…</figcaption></figure></main><div class="controls"><button id="previous" aria-label="Previous pose">← Previous</button><button id="next" aria-label="Next pose">Next →</button><button id="play" aria-pressed="false">Play turnaround</button><label id="speed-label">Speed <input id="speed" type="range" min="1" max="8" value="3" aria-label="Turnaround frames per second"></label><span id="count"></span></div><p id="mode-note" class="hint"></p><p id="action-description" class="hint"></p><div class="links"><a id="sheet">Original sheet</a><a id="manifest">Frame manifest</a></div><section id="frames" aria-label="Character poses"></section><p id="error" role="alert"></p><script type="module">
const $=id=>document.getElementById(id);let library=[],manifest=null,index=0,playing=false,elapsed=0,generation=0,catalogGeneration=0,base;
function url(path){return new URL(path,base).href}
function show(i){if(!manifest)return;index=(i+manifest.frames.length)%manifest.frames.length;const frame=manifest.frames[index];$('active').src=url(frame.file);$('active').alt=`${manifest.character}: ${frame.id}`;$('pose').textContent=frame.title??frame.id.replaceAll('-',' ');$('action-description').textContent=frame.description??'';$('count').textContent=`${index+1} / ${manifest.frames.length}`;[...$('frames').children].forEach((b,j)=>b.setAttribute('aria-pressed',String(j===index)));}
function toggle(force){playing=manifest?.playback===false?false:(force??!playing);elapsed=0;$('play').textContent=playing?'Pause turnaround':'Play turnaround';$('play').setAttribute('aria-pressed',String(playing));if(playing&&index>=8)show(0)}
async function choose(){const request=++generation;toggle(false);const entry=library[Number($('character').value)];const manifestUrl=new URL(`sprites/${entry.manifest}`,location.href);const [m,profile]=await Promise.all([fetch(manifestUrl).then(r=>r.json()),fetch(new URL('../profile.json',manifestUrl)).then(r=>r.json())]);if(request!==generation)return;manifest=m;base=manifestUrl;$('canonical').src=url(m.canonical);$('identity').textContent=profile.identity;$('sheet').href=url(m.source);$('manifest').href=base.href;$('frames').replaceChildren();m.frames.forEach((f,i)=>{const b=document.createElement('button');b.type='button';const img=new Image();img.src=url(f.file);img.alt='';b.append(img,document.createTextNode(f.title??f.id.replaceAll('-',' ')));b.onclick=()=>{toggle(false);show(i)};$('frames').append(b)});show(0)}
$('character').onchange=()=>choose().catch(fail);$('previous').onclick=()=>{toggle(false);show(index-1)};$('next').onclick=()=>{toggle(false);show(index+1)};$('play').onclick=()=>toggle();document.addEventListener('keydown',e=>{if(['SELECT','INPUT'].includes(document.activeElement.tagName))return;if(e.code==='Space'){e.preventDefault();toggle()}if(e.code==='ArrowRight')$('next').click();if(e.code==='ArrowLeft')$('previous').click()});
function tick(ms){if(!playing||!manifest)return;elapsed+=ms;const period=1000/Number($('speed').value);while(elapsed>=period){elapsed-=period;show((index+1)%8)}}let last=performance.now();function loop(now){tick(Math.min(now-last,100));last=now;requestAnimationFrame(loop)}requestAnimationFrame(loop);window.advanceTime=tick;window.render_game_to_text=()=>JSON.stringify({character:manifest?.character,pose:manifest?.frames[index]?.id,index,playing,frameCount:manifest?.frames.length,coordinates:'screen-relative: front faces viewer, right faces image right'});function fail(e){$('error').textContent=`Could not load character artwork: ${e.message}`}
async function loadLibrary(){const request=++catalogGeneration;const previous=$('character').selectedOptions[0]?.textContent;const work=$('library').value==='work';toggle(false);$('play').hidden=work;$('speed-label').hidden=work;$('mode-note').textContent=work?'Static work references. Select a scene to inspect its tools, workstation and pose. Motion variations come in the next animation pass.':'Arrow keys change pose. Space plays or pauses the eight-angle turnaround. Stances are key poses, not completed walk cycles.';const list=await fetch(`sprites/${work?'work-reference-library':'animation-library'}.json`).then(r=>r.json());if(request!==catalogGeneration)return;library=list.sort((a,b)=>a.name.localeCompare(b.name));$('character').replaceChildren();library.forEach((entry,i)=>{const option=document.createElement('option');option.value=i;option.textContent=entry.name;$('character').append(option)});const selected=library.findIndex(c=>c.name===(previous||(work?'Blacksmith':'Helga')));$('character').value=selected<0?0:selected;await choose()}
$('library').onchange=()=>loadLibrary().catch(fail);try{await loadLibrary()}catch(e){fail(e)}
</script></body></html>
