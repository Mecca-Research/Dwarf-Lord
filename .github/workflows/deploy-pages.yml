name: Build game

on:
  push:
    branches: [main]
  workflow_dispatch:

# Project Pages on this repo cannot be enabled with the GitHub App token
# (missing `pages` permission), so the playable build is published to the
# user site: https://mecca-research.github.io/Dwarf-Lord/
# Source of that copy: Mecca-Research/Mecca-Research.github.io

permissions:
  contents: read

concurrency:
  group: build-game
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:pages
      - name: Playable URL
        run: echo "Play at https://mecca-research.github.io/Dwarf-Lord/"
